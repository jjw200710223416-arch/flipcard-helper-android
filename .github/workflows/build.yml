name: Build APK

# 推送到 main/master 自动出包；也可以在仓库的 Actions 页面手动点 "Run workflow"。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================
  # 1) 算法内核回归测试
  #    纯 JDK，不需要 Android SDK，几秒钟跑完。
  #    用的是仓库自带的测试数据（由 JS 参考实现生成），验证 Java 内核行为一致。
  # ==================================================================
  coretest:
    name: 算法内核回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译并运行内核测试
        run: |
          set -e
          mkdir -p build/core build/coretest
          javac -encoding UTF-8 -d build/core app/src/main/java/com/flipcard/helper/core/*.java
          javac -encoding UTF-8 -cp build/core -d build/coretest tools/coretest/*.java
          java -cp build/core:build/coretest coretest.CoreSelfTest tools/coretest/fixtures

  # ==================================================================
  # 2) 构建 APK
  # ==================================================================
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    needs: coretest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件并接受许可
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 直接下 Gradle，不依赖任何 action 的 PATH 行为，也不依赖 gradle-wrapper.jar
      # （wrapper jar 是二进制，仓库里没带）
      - name: 安装 Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 debug 与 release APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: flipcard-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90
          if-no-files-found: error
